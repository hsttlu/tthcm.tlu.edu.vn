            { id: 300, q: "Vấn đề nào mà giáo trình Tư tưởng Hồ Chí Minh chưa nói khi nói về ý nghĩa học tập môn này đối với sinh viên?", opts: ["A. Nâng cao năng lực tư duy lý luận và các phương pháp công tác", "B. Bồi dưỡng phẩm chất đạo đức cách mạng và rèn luyện bản lĩnh chính trị", "C. Nâng cao lòng tự hào dân tộc, tự hào về Bác Hồ kính yêu", "D. Bồi dưỡng tình yêu thiên nhiên, ý thức bảo vệ môi trường"], ans: 3 },
            { id: 301, q: "Theo Hồ Chí Minh học chủ nghĩa Mác Lênin để làm gì ?", opts: ["A. Học thuộc các luận điểm lý luận", "B. Để chứng tỏ trình độ lý luận", "C. Để sống với nhau có tình có nghĩa", "D. Cả a b và c đều sai"], ans: 2 },
            { id: 302, q: "Điều mong muốn cuối cùng của Hồ Chí Minh ghi trong di chúc là gì ?", opts: ["A. Xây dựng một nước Việt Nam Phồn Vinh và Cường Thịnh", "B. Xây dựng một nước Việt Nam hòa bình, thống nhất, dân chủ, độc lập, giàu mạnh.", "C. Xây dựng một nước Việt Nam dân chủ, công bằng, văn minh", "D. Làm cho mọi người được hạnh phúc"], ans: 1 }
        ];

        const QUIZ_SETS = [
            { id: 1, title: "Đề số 1", start: 0, end: 60 },
            { id: 2, title: "Đề số 2", start: 60, end: 120 },
            { id: 3, title: "Đề số 3", start: 120, end: 180 },
            { id: 4, title: "Đề số 4", start: 180, end: 240 },
            { id: 5, title: "Đề số 5", start: 240, end: 302 }
        ];

        function getCompletedSets() {
            try { return JSON.parse(localStorage.getItem('hcm_completed_sets')) || []; } 
            catch(e) { return []; }
        }

        function markSetCompleted(setId) {
            let sets = getCompletedSets();
            if (!sets.includes(setId)) {
                sets.push(setId);
                localStorage.setItem('hcm_completed_sets', JSON.stringify(sets));
            }
        }

        let state = {
            questions: [],
            userAnswers: [],
            currentIndex: 0,
            timer: null,
            timeLeft: 0,
            totalTime: 0,
            view: 'start',
            currentSetId: null
        };

        const appRoot = document.getElementById('app-root');
        const headerTimer = document.getElementById('header-timer');
        const timeDisplay = document.getElementById('time-display');
        const globalModal = document.getElementById('global-modal');
        const modalPanel = document.getElementById('modal-panel');
        const modalBody = document.getElementById('modal-body');

        function showModal(title, message, isConfirm, onConfirm) {
            let btns = '';
            if (isConfirm) {
                btns = `
                    <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition">Hủy bỏ</button>
                    <button id="confirm-btn" class="px-5 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-200 transition">Đồng ý</button>
                `;
            } else {
                btns = `<button onclick="closeModal()" class="w-full px-5 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-200 transition">Đã hiểu</button>`;
            }

            modalBody.innerHTML = `
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-${isConfirm ? 'indigo' : 'amber'}-100 mb-6">
                    <i class="fas ${isConfirm ? 'fa-paper-plane text-indigo-600' : 'fa-exclamation-triangle text-amber-600'} text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">${title}</h3>
                <p class="text-gray-500 mb-8">${message}</p>
                <div class="flex flex-row justify-center gap-3">
                    ${btns}
                </div>
            `;

            globalModal.classList.remove('hidden');
            setTimeout(() => {
                globalModal.classList.remove('opacity-0');
                modalPanel.classList.remove('scale-95');
            }, 10);

            if (isConfirm) {
                document.getElementById('confirm-btn').onclick = () => {
                    closeModal();
                    onConfirm();
                };
            }
        }

        function showRetryOptions(setId) {
            modalBody.innerHTML = `
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-indigo-100 mb-6">
                    <i class="fas fa-random text-indigo-600 text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">Tùy chọn thi lại Đề số ${setId}</h3>
                <p class="text-gray-500 mb-6 text-sm">Bạn muốn làm lại đề này theo trình tự gốc hay đảo thứ tự các câu hỏi để thử thách trí nhớ?</p>
                <div class="flex flex-col gap-3">
                    <button onclick="closeModal(); startQuiz(${setId}, false)" class="px-5 py-3.5 bg-white text-indigo-700 font-bold rounded-xl hover:bg-indigo-50 transition border-2 border-indigo-200 text-left flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center"><i class="fas fa-sort-numeric-down"></i></div>
                        1. Thi lại theo trình tự đề gốc
                    </button>
                    <button onclick="closeModal(); startQuiz(${setId}, true)" class="px-5 py-3.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-200 transition text-left flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center"><i class="fas fa-random text-white"></i></div>
                        2. Đảo đề (Trộn câu hỏi)
                    </button>
                    <button onclick="closeModal()" class="px-5 py-2 text-slate-500 font-semibold hover:text-slate-700 mt-2">Hủy bỏ</button>
                </div>
            `;

            globalModal.classList.remove('hidden');
            setTimeout(() => {
                globalModal.classList.remove('opacity-0');
                modalPanel.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            globalModal.classList.add('opacity-0');
            modalPanel.classList.add('scale-95');
            setTimeout(() => globalModal.classList.add('hidden'), 300);
        }
        
        function goHome() {
            if (state.view === 'quiz') {
                showModal("Xác nhận thoát", "Bạn đang làm bài thi. Nếu thoát bây giờ, quá trình làm bài sẽ không được lưu. Bạn có chắc chắn muốn quay về trang chủ không?", true, () => {
                    clearInterval(state.timer);
                    headerTimer.classList.add('hidden');
                    state.view = 'start';
                    renderStart();
                });
            } else {
                clearInterval(state.timer);
                headerTimer.classList.add('hidden');
                state.view = 'start';
                renderStart();
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function shuffleArray(array) {
            let shuffled = array.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startTimer() {
            headerTimer.classList.remove('hidden');
            headerTimer.classList.add('flex');
            
            state.timer = setInterval(() => {
                state.timeLeft--;
                timeDisplay.textContent = formatTime(state.timeLeft);
                
                if (state.timeLeft <= 300) { 
                    headerTimer.classList.remove('bg-violet-50', 'text-violet-700');
                    headerTimer.classList.add('bg-red-50', 'text-red-600');
                }
                
                if (state.timeLeft <= 0) {
                    clearInterval(state.timer);
                    submitQuiz(true);
                }
            }, 1000);
        }

        function renderStart() {
            const completedSets = getCompletedSets();

            let setsHtml = QUIZ_SETS.map(set => {
                const isCompleted = completedSets.includes(set.id);
                let actionBtn = isCompleted
                    ? `<button onclick="showRetryOptions(${set.id})" class="w-full py-2.5 sm:py-3 mt-3 sm:mt-4 bg-indigo-50 text-indigo-700 font-bold text-sm sm:text-base rounded-xl hover:bg-indigo-100 transition border border-indigo-200 shadow-sm"><i class="fas fa-redo mr-1.5 sm:mr-2"></i>Thi lại</button>`
                    : `<button onclick="startQuiz(${set.id}, false)" class="w-full py-2.5 sm:py-3 mt-3 sm:mt-4 bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-bold text-sm sm:text-base rounded-xl hover:shadow-lg hover:shadow-violet-200 transition"><i class="fas fa-play mr-1.5 sm:mr-2"></i><span class="hidden sm:inline">Bắt đầu làm bài</span><span class="sm:hidden">Bắt đầu</span></button>`;

                let badge = isCompleted ? `<span class="px-2 py-0.5 sm:px-2.5 sm:py-1 text-[0.65rem] sm:text-xs font-bold bg-emerald-100 text-emerald-700 rounded-full sm:ml-auto border border-emerald-200 w-max mt-1 sm:mt-0"><i class="fas fa-check-circle mr-1"></i>Đã làm</span>` : '';

                return `
                    <div class="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-[1.5rem] border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col">
                        <div class="flex flex-col sm:flex-row sm:items-center mb-3 sm:mb-4">
                            <div class="flex items-center">
                                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-violet-100 text-violet-600 flex items-center justify-center text-lg sm:text-xl font-black mr-2.5 sm:mr-3 shrink-0">
                                    ${set.id}
                                </div>
                                <div>
                                    <h3 class="text-base sm:text-xl font-extrabold text-slate-800">${set.title}</h3>
                                    <div class="sm:hidden">${badge}</div>
                                </div>
                            </div>
                            <div class="hidden sm:block ml-auto">${badge}</div>
                        </div>
                        <p class="text-slate-500 font-medium text-xs sm:text-sm mb-1.5 sm:mb-2 truncate"><i class="fas fa-list-ol mr-1.5 sm:mr-2 w-3.5 text-center text-violet-400"></i>${set.end - set.start} câu</p>
                        <p class="text-slate-500 font-medium text-xs sm:text-sm flex-1 truncate"><i class="fas fa-clock mr-1.5 sm:mr-2 w-3.5 text-center text-violet-400"></i>40 phút</p>
                        ${actionBtn}
                    </div>
                `;
            }).join('');

            appRoot.innerHTML = `
                <div class="max-w-5xl mx-auto mt-6 sm:mt-10 mb-10 px-2 sm:px-4">
                    <div class="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 p-4 sm:p-12 border border-slate-100 animate-fade-in relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-violet-500 to-fuchsia-500"></div>
                        
                        <!-- Lưới đề thi: Chia 2 cột trên mobile và 3 cột ở màn hình lớn -->
                        <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-6 mt-2">
                            ${setsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function startQuiz(setId, isShuffled) {
            const setConfig = QUIZ_SETS.find(s => s.id === setId);
            let subset = ALL_QUESTIONS.slice(setConfig.start, setConfig.end);

            if (isShuffled) {
                subset = shuffleArray(subset);
            }

            state.questions = subset;
            state.view = 'quiz';
            state.userAnswers = new Array(subset.length).fill(null);
            state.currentIndex = 0;
            state.currentSetId = setId;
            
            // Cố định thời gian 40 phút = 2400 giây
            state.totalTime = 40 * 60;
            state.timeLeft = state.totalTime;
            
            // Reset timer colors
            headerTimer.classList.add('bg-violet-50', 'text-violet-700');
            headerTimer.classList.remove('bg-red-50', 'text-red-600');
            
            renderQuiz();
            startTimer();
        }

        function toggleMobileNav(forceClose = false) {
            const sidebar = document.getElementById('quiz-sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (!sidebar || !overlay) return;
            
            if (forceClose || !sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    // Chỉ ẩn visibility sau khi Sidebar đã thu vào (dành cho mobile)
                    if (window.innerWidth < 1280) sidebar.style.visibility = 'hidden';
                }, 300);
            } else {
                sidebar.style.visibility = 'visible';
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            }
        }

        function renderQuiz() {
            const totalQs = state.questions.length;
            const currentQ = state.questions[state.currentIndex];
            const answeredCount = state.userAnswers.filter(a => a !== null).length;
            const progress = (answeredCount / totalQs) * 100;

            let navHtml = '';
            for (let i = 0; i < totalQs; i++) {
                let btnClass = 'nav-btn w-full aspect-square flex items-center justify-center rounded-xl border font-semibold cursor-pointer text-xs sm:text-sm transition-colors ';
                if (i === state.currentIndex) {
                    btnClass += ' bg-violet-600 text-white border-violet-600 shadow-md shadow-violet-200 transform scale-105';
                } else if (state.userAnswers[i] !== null) {
                    btnClass += ' bg-violet-50 text-violet-700 border-violet-200 hover:border-violet-300';
                } else {
                    btnClass += ' bg-white text-slate-600 border-slate-200 hover:border-violet-300';
                }
                navHtml += `<div class="${btnClass}" onclick="jumpTo(${i}); window.innerWidth < 1280 && toggleMobileNav(true);">${i + 1}</div>`;
            }

            const optionsHtml = currentQ.opts.map((optText, optIdx) => {
                const isSelected = state.userAnswers[state.currentIndex] === optIdx;
                const classSelected = isSelected 
                    ? 'border-violet-500 bg-violet-50/70 shadow-sm shadow-violet-100' 
                    : 'border-slate-200 hover:border-violet-200 bg-white';
                
                return `
                    <label class="flex items-start sm:items-center gap-3 sm:gap-4 p-3.5 sm:p-4 rounded-xl sm:rounded-2xl border-2 cursor-pointer transition-all duration-200 ${classSelected} mb-3" onclick="selectOption(${optIdx})">
                        <input type="radio" name="option" class="hidden" ${isSelected ? 'checked' : ''}>
                        <div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center mt-0.5 sm:mt-0 transition-colors ${isSelected ? 'border-violet-600 bg-white' : 'border-slate-300'}">
                            ${isSelected ? '<div class="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-violet-600 rounded-full"></div>' : ''}
                        </div>
                        <span class="text-slate-700 font-medium text-[0.95rem] sm:text-[1.05rem] leading-snug sm:leading-relaxed">${optText}</span>
                    </label>
                `;
            }).join('');

            appRoot.innerHTML = `
                <!-- Thiết lập chiều cao để khóa scroll màn hình tổng -->
                <div style="height: calc(100dvh - 100px); min-height: 450px;" class="flex flex-col xl:flex-row gap-4 sm:gap-6 animate-fade-in w-full">
                    
                    <!-- Left: Main Question Area -->
                    <div class="w-full xl:w-8/12 flex flex-col bg-white rounded-[1.5rem] sm:rounded-3xl shadow-sm border border-slate-200 overflow-hidden relative h-full shrink-0">
                        
                        <!-- Top Bar inside Quiz -->
                        <div class="px-4 sm:px-5 py-3 border-b border-slate-100 flex justify-between items-center bg-white z-10 shrink-0">
                            <div class="inline-flex items-center gap-2 px-3 sm:px-3.5 py-1.5 bg-violet-50 text-violet-700 rounded-lg text-sm font-bold">
                                <i class="fas fa-flag"></i> Câu hỏi ${state.currentIndex + 1} / ${totalQs} 
                            </div>
                            
                            <!-- Mobile Hamburger Menu Button -->
                            <button onclick="toggleMobileNav()" class="xl:hidden w-10 h-10 rounded-xl bg-slate-50 text-slate-700 flex items-center justify-center hover:bg-slate-100 active:bg-slate-200 border border-slate-200 transition-colors shadow-sm">
                                <i class="fas fa-bars text-lg"></i>
                            </button>
                        </div>

                        <!-- Scrollable Content Area -->
                        <div class="flex-1 overflow-y-auto p-4 sm:p-8 md:p-10 custom-scrollbar bg-white">
                            <!-- Question Text -->
                            <h3 class="text-[1.1rem] sm:text-[1.3rem] font-bold text-slate-800 mb-5 sm:mb-8 leading-relaxed">
                                ${currentQ.q}
                            </h3>
                            
                            <!-- Options -->
                            <div class="flex flex-col pb-2">
                                ${optionsHtml}
                            </div>
                        </div>

                        <!-- Footer Navigation -->
                        <div class="bg-white px-4 sm:px-8 py-3 sm:py-4 border-t border-slate-100 flex justify-between items-center shrink-0">
                            <button onclick="prevQuestion()" class="px-4 sm:px-5 py-2.5 sm:py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 active:bg-slate-100 transition flex items-center gap-2 ${state.currentIndex === 0 ? 'invisible' : ''}">
                                <i class="fas fa-arrow-left"></i> <span class="hidden sm:inline">Câu trước</span><span class="sm:hidden">Trước</span>
                            </button>
                            ${state.currentIndex === totalQs - 1 
                                ? `<button onclick="confirmSubmit()" class="px-6 sm:px-7 py-2.5 sm:py-3 bg-[#1e3a8a] hover:bg-[#172554] text-white font-bold rounded-xl transition flex items-center gap-2 shadow-md">Nộp bài <i class="fas fa-paper-plane"></i></button>`
                                : `<button onclick="nextQuestion()" class="px-6 sm:px-7 py-2.5 sm:py-3 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white font-bold rounded-xl transition flex items-center gap-2 shadow-md shadow-violet-200">
                                    <span class="hidden sm:inline">Câu tiếp theo</span><span class="sm:hidden">Tiếp</span> <i class="fas fa-arrow-right"></i>
                                   </button>`
                            }
                        </div>
                    </div>

                    <!-- Mobile Overlay (Backdrop) -->
                    <div id="mobile-overlay" onclick="toggleMobileNav(true)" class="fixed inset-0 bg-slate-900/40 z-40 hidden xl:hidden backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>

                    <!-- Right: Sidebar Grid -->
                    <!-- Lớp xl:!visible ghi đè visibility: hidden trên màn hình PC -->
                    <div id="quiz-sidebar" style="visibility: hidden;" class="fixed inset-y-0 right-0 z-50 w-[85%] max-w-sm bg-white shadow-2xl transform translate-x-full transition-transform duration-300 xl:relative xl:translate-x-0 xl:!visible xl:w-4/12 flex flex-col xl:rounded-3xl xl:border border-slate-200 overflow-hidden h-full">
                        
                        <!-- Mobile Drawer Header -->
                        <div class="p-4 border-b border-slate-100 xl:hidden flex justify-between items-center bg-slate-50 shrink-0">
                            <h4 class="font-bold text-slate-800 flex items-center gap-2">
                                <i class="fas fa-tasks text-violet-600"></i> Tiến độ làm bài
                            </h4>
                            <button onclick="toggleMobileNav(true)" class="w-8 h-8 rounded-lg bg-slate-200 text-slate-600 flex items-center justify-center hover:bg-slate-300 transition">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <div class="p-5 sm:p-6 flex flex-col h-full overflow-hidden bg-white">
                            <!-- Progress Header -->
                            <div class="flex justify-between items-center mb-3 shrink-0">
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Tiến độ làm bài</span>
                                <span class="text-sm font-bold text-violet-600 bg-violet-50 px-3 py-1 rounded-lg">${answeredCount}/${totalQs}</span>
                            </div>
                            
                            <!-- Progress Bar -->
                            <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden mb-6 shrink-0">
                                <div class="h-full bg-violet-500 rounded-full transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                            </div>

                            <h4 class="font-bold text-slate-800 mb-5 flex items-center gap-3 text-lg shrink-0">
                                <div class="w-8 h-8 rounded-lg bg-violet-50 text-violet-600 flex items-center justify-center">
                                    <i class="fas fa-list-ul text-sm"></i>
                                </div>
                                Danh sách câu hỏi
                            </h4>
                            
                            <!-- Scrollable Grid -->
                            <div class="flex-1 overflow-y-auto custom-scrollbar pr-2 mb-4 relative">
                                <div class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-5 xl:grid-cols-5 gap-2">
                                    ${navHtml}
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="shrink-0 pt-4 border-t border-slate-100 mt-auto">
                                <button onclick="confirmSubmit()" class="w-full py-3.5 bg-[#1e3a8a] hover:bg-[#172554] text-white font-bold rounded-xl transition flex justify-center items-center gap-2 shadow-md">
                                    <i class="fas fa-paper-plane"></i> Nộp bài
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectOption(optIdx) {
            state.userAnswers[state.currentIndex] = optIdx;
            renderQuiz(); 
        }

        function nextQuestion() {
            if (state.currentIndex < state.questions.length - 1) {
                state.currentIndex++;
                renderQuiz();
            }
        }

        function prevQuestion() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuiz();
            }
        }

        function jumpTo(idx) {
            state.currentIndex = idx;
            renderQuiz();
        }

        function confirmSubmit() {
            const unanswered = state.userAnswers.filter(a => a === null).length;
            let msg = "Bạn có chắc chắn muốn nộp bài ngay lúc này không?";
            if (unanswered > 0) {
                msg = `Bạn còn <strong class="text-red-500">${unanswered} câu</strong> chưa làm. Bạn vẫn muốn nộp chứ?`;
            }
            showModal("Xác nhận nộp bài", msg, true, () => submitQuiz(false));
        }

        function submitQuiz(isTimeout = false) {
            clearInterval(state.timer);
            headerTimer.classList.add('hidden');
            
            if (isTimeout) {
                showModal("Hết giờ", "Đã hết 40 phút làm bài! Hệ thống tự động thu bài.", false, null);
            }

            // Save completed state
            if (state.currentSetId) {
                markSetCompleted(state.currentSetId);
            }
            
            state.view = 'result';
            renderResult();
        }

        function renderResult() {
            let correct = 0;
            let unanswered = 0;
            const totalQs = state.questions.length;
            
            state.questions.forEach((q, i) => {
                if (state.userAnswers[i] === null) {
                    unanswered++;
                } else if (state.userAnswers[i] === q.ans) {
                    correct++;
                }
            });
            
            let incorrect = totalQs - correct - unanswered;
            let score10 = ((correct / totalQs) * 10).toFixed(1);
            
            // Yêu cầu: dưới 5đ đỏ, trên 5đ xanh
            let gradeColor = score10 >= 5 ? 'text-emerald-500' : 'text-rose-500';

            appRoot.innerHTML = `
                <div class="max-w-4xl mx-auto mt-6 sm:mt-8 mb-10">
                    <div class="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 overflow-hidden border border-slate-100 animate-fade-in">
                        
                        <!-- Result Header -->
                        <div class="bg-white p-8 sm:p-12 text-center relative border-b border-slate-100">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-violet-50 rounded-full mb-4 shadow-sm border border-violet-100">
                                <i class="fas fa-award text-3xl text-violet-600"></i>
                            </div>
                            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Kết Quả Bài Thi</h2>
                            <p class="text-slate-500 font-medium">Đề số ${state.currentSetId} • ${totalQs} Câu hỏi</p>
                            <div class="mt-6 mb-2 flex items-baseline justify-center gap-1">
                                <span class="text-6xl sm:text-7xl font-black ${gradeColor} drop-shadow-sm leading-none">${score10}</span>
                                <span class="text-2xl text-slate-300 font-bold">/10</span>
                            </div>
                        </div>

                        <!-- Stats Grid -->
                        <div class="p-4 sm:p-10 bg-slate-50/30">
                            <!-- Hiển thị 3 cột ngang hàng ngay cả trên mobile (grid-cols-3) -->
                            <div class="grid grid-cols-3 gap-2 sm:gap-6 mb-8 sm:mb-10">
                                <!-- Correct Box -->
                                <div onclick="renderReview('correct')" class="bg-white rounded-xl sm:rounded-2xl p-3 sm:p-6 flex flex-col items-center justify-center border border-slate-200 cursor-pointer hover:border-emerald-300 hover:shadow-md transition-all shadow-sm">
                                    <div class="text-2xl sm:text-4xl font-bold text-emerald-500 mb-1.5 sm:mb-2 leading-none">${correct}</div>
                                    <div class="text-[0.65rem] sm:text-[0.8rem] font-bold text-slate-500 uppercase tracking-widest text-center leading-tight">ĐÚNG</div>
                                </div>
                                
                                <!-- Incorrect Box -->
                                <div onclick="renderReview('incorrect')" class="bg-white rounded-xl sm:rounded-2xl p-3 sm:p-6 flex flex-col items-center justify-center border border-slate-200 cursor-pointer hover:border-rose-300 hover:shadow-md transition-all shadow-sm">
                                    <div class="text-2xl sm:text-4xl font-bold text-rose-500 mb-1.5 sm:mb-2 leading-none">${incorrect}</div>
                                    <div class="text-[0.65rem] sm:text-[0.8rem] font-bold text-slate-500 uppercase tracking-widest text-center leading-tight">SAI</div>
                                </div>
                                
                                <!-- Unanswered Box -->
                                <div onclick="renderReview('unanswered')" class="bg-white rounded-xl sm:rounded-2xl p-3 sm:p-6 flex flex-col items-center justify-center border border-slate-200 cursor-pointer hover:border-slate-400 hover:shadow-md transition-all shadow-sm">
                                    <div class="text-2xl sm:text-4xl font-bold text-slate-400 mb-1.5 sm:mb-2 leading-none">${unanswered}</div>
                                    <div class="text-[0.65rem] sm:text-[0.8rem] font-bold text-slate-500 uppercase tracking-widest text-center leading-tight">BỎ TRỐNG</div>
                                </div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="flex flex-col sm:flex-row justify-center gap-3 sm:gap-4">
                                <button onclick="renderReview('all')" class="w-full sm:w-auto px-6 py-3.5 sm:px-8 sm:py-4 bg-white text-violet-700 font-bold rounded-xl hover:bg-violet-50 transition flex items-center justify-center gap-2 border border-violet-200 shadow-sm">
                                    <i class="fas fa-search"></i> Xem lại tất cả
                                </button>
                                <button onclick="goHome()" class="w-full sm:w-auto px-6 py-3.5 sm:px-8 sm:py-4 bg-[#1e3a8a] text-white font-bold rounded-xl hover:bg-[#172554] shadow-md transition flex items-center justify-center gap-2">
                                    <i class="fas fa-list"></i> Danh sách đề thi
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function scrollToTopReview() {
            const container = document.getElementById('review-container');
            if (container) {
                // Di chuyển lên sao cho câu số 1 nằm vừa vặn dưới thanh công cụ
                const y = container.getBoundingClientRect().top + window.scrollY - 140; 
                window.scrollTo({top: y, behavior: 'smooth'});
            } else {
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function renderReview(filter = 'all') {
            let filterTitle = "Chi tiết bài làm";
            let filterIcon = "fa-clipboard-check text-indigo-500";
            
            if(filter === 'correct') {
                filterTitle = "Các câu đã làm ĐÚNG";
                filterIcon = "fa-check-circle text-emerald-500";
            } else if (filter === 'incorrect') {
                filterTitle = "Các câu đã làm SAI";
                filterIcon = "fa-times-circle text-rose-500";
            } else if (filter === 'unanswered') {
                filterTitle = "Các câu BỎ TRỐNG";
                filterIcon = "fa-minus-circle text-slate-600";
            }

            let reviewList = state.questions.map((q, qIdx) => {
                const userAns = state.userAnswers[qIdx];
                const isCorrect = userAns === q.ans;
                const isSkipped = userAns === null;
                const isIncorrect = !isCorrect && !isSkipped;
                
                if (filter === 'correct' && !isCorrect) return '';
                if (filter === 'incorrect' && !isIncorrect) return '';
                if (filter === 'unanswered' && !isSkipped) return '';

                let titleColor = isCorrect ? 'text-emerald-600' : (isSkipped ? 'text-slate-600' : 'text-rose-600');
                let icon = isCorrect ? '<i class="fas fa-check-circle mr-2"></i>' : (isSkipped ? '<i class="fas fa-minus-circle mr-2"></i>' : '<i class="fas fa-times-circle mr-2"></i>');

                let optsHtml = q.opts.map((optText, oIdx) => {
                    let classes = "flex items-start gap-2.5 sm:gap-3 p-2.5 sm:p-3 rounded-lg border text-[0.9rem] sm:text-base mb-2 font-medium ";
                    let optIcon = `<div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full border-2 border-slate-300 flex-shrink-0 mt-0.5 sm:mt-0.5"></div>`;
                    
                    if (oIdx === q.ans) {
                        classes += "border-emerald-400 bg-emerald-50 text-emerald-800 shadow-sm";
                        optIcon = `<i class="fas fa-check-circle text-emerald-500 text-lg sm:text-xl flex-shrink-0"></i>`;
                    } else if (oIdx === userAns) {
                        classes += "border-rose-300 bg-rose-50 text-rose-800 shadow-sm";
                        optIcon = `<i class="fas fa-times-circle text-rose-500 text-lg sm:text-xl flex-shrink-0"></i>`;
                    } else {
                        classes += "border-slate-100 bg-slate-50 text-slate-600";
                    }

                    return `<div class="${classes}">${optIcon}<span>${optText}</span></div>`;
                }).join('');

                return `
                    <div class="bg-white p-5 sm:p-6 rounded-xl sm:rounded-2xl shadow-sm border border-slate-200 mb-4 sm:mb-6">
                        <h4 class="text-base sm:text-lg font-bold mb-3 sm:mb-4 ${titleColor} flex items-start leading-snug">
                            <span class="mr-2 mt-0.5">${icon}</span>
                            <span>Câu ${qIdx + 1}: ${q.q}</span>
                        </h4>
                        <div class="pl-0 sm:pl-7">
                            ${optsHtml}
                        </div>
                    </div>
                `;
            }).join('');
            
            if(reviewList.trim() === '') {
                reviewList = `
                <div class="bg-white p-6 sm:p-10 text-center rounded-2xl shadow-sm border border-slate-200 mb-6">
                    <i class="fas fa-box-open text-4xl sm:text-5xl text-slate-300 mb-3 sm:mb-4"></i>
                    <p class="text-slate-500 text-sm sm:text-base font-normal whitespace-nowrap">Không có câu hỏi nào trong mục này.</p>
                </div>`;
            }

            appRoot.innerHTML = `
                <div id="review-container" class="max-w-4xl mx-auto animate-fade-in pb-10 pt-2 relative">
                    <!-- Sticky Header (Cố định thanh menu) -->
                    <!-- Dùng sticky, top-[64px] (vừa khít dưới thanh header chính), thêm backdrop-blur để đẹp hơn -->
                    <div class="flex flex-row justify-between items-center mb-6 gap-2 bg-white/95 backdrop-blur-md px-4 sm:px-6 py-4 rounded-xl shadow-sm border border-slate-200 sticky top-[64px] z-30">
                        
                        <h2 class="text-lg sm:text-xl font-bold text-slate-800 truncate"><i class="fas ${filterIcon} mr-2"></i> <span class="hidden sm:inline">${filterTitle}</span></h2>
                        
                        <!-- Nút chức năng giống hình 2 -->
                        <div class="flex gap-2 sm:gap-3 ml-auto shrink-0">
                            <button onclick="renderResult()" class="px-4 py-2 sm:px-5 sm:py-2.5 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition text-sm sm:text-base flex items-center gap-2">
                                <i class="fas fa-arrow-left"></i> Quay lại
                            </button>
                            <button onclick="scrollToTopReview()" class="px-4 py-2 sm:px-5 sm:py-2.5 bg-indigo-50 text-indigo-700 font-semibold rounded-xl hover:bg-indigo-100 transition text-sm sm:text-base flex items-center gap-2">
                                <i class="fas fa-arrow-up"></i> Lên đầu
                            </button>
                        </div>
                        
                    </div>
                    
                    <!-- Nội dung các câu hỏi xem lại -->
                    <div>
                        ${reviewList}
                    </div>
                </div>
            `;
        }

        // Khởi động app
        window.onload = renderStart;

    </script>
</body>
</html>
