    <script>
        const ALL_QUESTIONS = [
            { id: 1, q: "Chọn phương pháp đúng nhất về phương pháp lịch sử trong nghiên cứu tư tưởng Hồ Chí Minh?", opts: ["A. Nghiên cứu thực tiễn, coi trọng tổng kết thực tiễn, quán triệt quan điểm lý luận gắn với thực tiễn", "B. Nghiên cứu một cách tổng quát nhằm tìm ra được cái bản chất vốn có của sự vật, hiện tượng và khái quát thành lý luận", "C. Nghiên cứu sự vật và hiện tượng theo quá trình phát sinh, tồn tại, phát triển", "D. Nghiên cứu tiến trình vận động, sự vật hiện tượng của lịch sử Đảng"], ans: 2 },
            { id: 2, q: "Theo Hồ Chí Minh, cách mạng giải phóng dân tộc ở các nước thuộc địa phải được tiến hành như thế nào?", opts: ["A. Chủ động không nên trông chờ, ỷ lại vào cách mạng vô sản ở chính quốc", "B. Phải phát huy tinh thần độc lập, tự chủ, tự lực, tự cường 'lấy sức ta mà giải phóng cho ta'", "C. Bằng sức mạnh của dân tộc mà giải phóng cho dân tộc mình thoát khỏi kiếp ngựa trâu, nô lệ", "D. Tất cả phương án"], ans: 3 },
            { id: 3, q: "Hoàn chỉnh câu sau: Cuộc cách mạng vô sản ở nước Nga thành công đã nêu một tấm gương sáng về sự giải phóng dân tộc bị áp bức mở ra trước mắt họ thời đại của các mạng chống [...] thời đại giải phóng dân tộc\"", opts: ["A. Phong kiến", "B. Đế quốc", "C. Nông dân", "D. Công nhân"], ans: 1 },
            { id: 4, q: "Hoàn chỉnh câu sau: 'Công nông là gốc của cách mạng, còn học trò, nhà buôn nhỏ, điền chủ nhỏ cũng bị tư bản áp bức, song không cực khổ bằng công nông: 3 hạng ấy chỉ là [...] cách mệnh của công nông thôi'", opts: ["A. Bạn đồng minh", "B. Người ủng hộ", "C. Người dẫn đường", "D. Bầu bạn"], ans: 3 },
            { id: 5, q: "Hoàn chỉnh câu sau: 'Cộng sản có 2 giai đoạn, giai đoạn thấp tức là [1], giai đoạn cao là [2]' (Trong tác phẩm: Thưởng thức chính trị-45. CNXH)", opts: ["A. Chủ nghĩa xã hội, Chủ nghĩa cộng sản", "B. Thời kỳ quá độ, Chủ nghĩa cộng sản", "C. Chủ nghĩa tư bản, Chủ nghĩa cộng sản", "D. Cách mạng giải phóng dân tộc, Chủ nghĩa xã hội"], ans: 0 },
            { id: 6, q: "Nguyễn Ái Quốc đọc 'Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và thuộc địa của Lênin' vào thời gian nào?", opts: ["A. Tháng 2/1921", "B. Tháng 7/1920", "C. Tháng 12/1920", "D. Tháng 6/1919"], ans: 1 },
            { id: 7, q: "Hoàn chỉnh câu sau: Khi trả lời ông Vaxiđéprao, thông tín viên hãng Roitơ Hồ Chí Minh khẳng định: 'Độc lập nghĩa là chúng tôi điều khiển lấy mọi công việc của chúng tôi, [...]'", opts: ["A. Không có sự can thiệp ở ngoài vào", "B. Phù hợp với điều kiện nước tôi", "C. Tự quyết định con đường phát triển của chúng tôi", "D. Tự lựa chọn con đường phát triển cho phù hợp với xu thế của thời đại"], ans: 0 },
            { id: 8, q: "Khi nghiên cứu về các cuộc cách mạng tư sản, Hồ Chí Minh xác định đó là những cuộc cách mạng như thế nào?", opts: ["A. Thắng lợi", "B. Chưa trọn vẹn", "C. Không đến nơi", "D. Không thành công"], ans: 2 },
            { id: 9, q: "Chọn đáp án đúng nhất về nội dung chủ nghĩa Tam Dân của Tôn Trung Sơn", opts: ["A. Dân tộc độc lập, dân quyền tự do, dân sinh hạnh phúc", "B. Tự do, bình đẳng, bác ái", "C. Độc lập dân tộc gắn liền với chủ nghĩa xã hội", "D. Độc lập, tự do, hạnh phúc"], ans: 0 },
            { id: 10, q: "Lựa chọn đáp án đúng cho nhận định sau: Việc tiếp thu Chủ nghĩa Mác-Lênin ở Hồ Chí Minh diễn ra trên nền tảng của:", opts: ["A. Sự thông minh, nhạy bén, đạo đức, phẩm chất của Người", "B. Những tri thức văn hóa tinh túy được chắt lọc, hấp thụ; sự thông minh, nhạy bén của Người", "C. Những tri thức văn hóa tinh túy, một vốn chính trị và vốn hiểu biết phong phú", "D. Một vốn chính trị, vốn hiểu biết phong phú; sự thông minh, nhạy bén của Người"], ans: 2 },
            { id: 11, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: Đối với cán bộ, đảng viên, Hồ Chí Minh nhấn mạnh: “Trước mặt quần chúng, không phải ta cứ viết lên trán chữ [...] mà ta được họ yêu mến. Quần chúng chỉ quý mến những người có [...]”", opts: ["A. 'Liêm khiết', đạo đức", "B. 'Cộng sản', tư cách, đạo đức", "C. 'Cộng sản', đạo đức cách mạng", "D. 'Liêm chính', đạo đức cách mạng"], ans: 1 },
            { id: 12, q: "Theo Hồ Chí Minh, các lực lượng của đoàn kết quốc tế là:", opts: ["A. Phong trào cộng sản và công nhân thế giới", "B. Phong trào đấu tranh giải phóng dân tộc", "C. Tất cả phương án", "D. Các lực lượng tiến bộ, những người yêu chuộng hòa bình, dân chủ, tự do, công lý"], ans: 2 },
            { id: 13, q: "Các phong trào yêu nước Việt Nam những năm cuối thế kỷ XIX, đầu thế kỷ XX diễn ra theo những khuynh hướng nào?", opts: ["A. Khuynh hướng dân chủ tư sản", "B. Khuynh hướng phong kiến", "C. Khuynh hướng phong kiến và vô sản", "D. Khuynh hướng phong kiến và dân chủ tư sản"], ans: 3 },
            { id: 14, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: “Chế độ ta là chế độ dân chủ, tư tưởng phải được tự do. Tự do là thế nào? Đối với mọi vấn đề, mọi người tự do bày tỏ ý kiến của mình, góp phần tìm ra [...]”", opts: ["A. Nguyên tắc", "B. Lý lẽ", "C. Chân lý", "D. Thực tiễn"], ans: 2 },
            { id: 15, q: "Theo Hồ Chí Minh, trong Nhà nước pháp quyền nhân nghĩa, pháp luật có tính?", opts: ["A. Nhân văn", "B. Nhân văn, khuyến thiện", "C. Khuyến thiện", "D. Nhân đạo"], ans: 1 },
            { id: 16, q: "Sáng tạo lớn nhất trong tư tưởng Hồ Chí Minh về cách mạng giải phóng dân tộc thuộc địa là gì?", opts: ["A. Cách mạng giải phóng dân tộc được tiến hành chủ động, sáng tạo và có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc", "B. Tiến hành bằng con đường bạo lực cách mạng", "C. Đảng Cộng sản lãnh đạo", "D. Xác định lực lượng cách mạng giải phóng dân tộc là toàn dân tộc"], ans: 0 },
            { id: 17, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: “Nền kinh tế mà chúng ta xây dựng cần phải phát triển toàn diện các ngành với những ngành chủ yếu là: công - nông - thương nghiệp; trong đó, [...] là hai cái chân của nền kinh tế nước nhà”", opts: ["A. Nông nghiệp và thương nghiệp", "B. Công nghiệp nặng và nông nghiệp", "C. Nông nghiệp và công nghiệp nhẹ", "D. Công nghiệp và nông nghiệp"], ans: 3 },
            { id: 18, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: “Chúng ta đã hy sinh làm cách mệnh, thì nên làm cho đến nơi, nghĩa là làm sao cách mệnh rồi thì quyền giao cho dân chúng [...], chớ để trong tay một bọn ít người”", opts: ["A. Đông đảo", "B. Số nhiều", "C. Yêu nước", "D. Tiến bộ"], ans: 1 },
            { id: 19, q: "Câu nói sau được trích trong tác phẩm nào của Hồ Chí Minh? “Bồi dưỡng thế hệ cách mạng cho đời sau là việc làm rất quan trọng và cần thiết”", opts: ["A. Đạo đức cách mạng", "B. Đường cách mệnh", "C. Sửa đổi lối làm việc", "D. Di chúc"], ans: 3 },
            { id: 20, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: Đại hội VII (1991) của Đảng khẳng định: “Lấy chủ nghĩa Mác-Lênin và Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, [...]”", opts: ["A. Kim chỉ nam cho hành động của Đảng và nhân dân", "B. Kim chỉ nam cho hành động của Đảng", "C. Kim chỉ nam cho hành động", "D. Kim chỉ nam"], ans: 1 },
            { id: 21, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: Đoàn kết là sức mạnh của chúng ta, đoàn kết là [...] của chúng ta”", opts: ["A. Cái gốc", "B. Thành công", "C. Vẻ vang", "D. Thắng lợi"], ans: 3 },
            { id: 22, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: “[...] có vững thì cây mới bền. Xây lầu thắng lợi trên nền [...]”", opts: ["A. Gốc; nông dân", "B. Gốc; nhân dân", "C. Gốc; công nhân", "D. Rễ; công nông"], ans: 1 },
            { id: 23, q: "Theo Hồ Chí Minh, đối với một quốc gia, cần, kiệm, liêm, chính là thước đo:", opts: ["A. Bề dày của truyền thống đạo đức của dân tộc", "B. Sự giàu có của dân tộc Việt Nam", "C. Sự giàu có về vật chất, vững mạnh về tinh thần, thể hiện sự văn minh tiến bộ của dân tộc", "D. Sự phong phú của truyền thống văn hóa lâu đời của dân tộc"], ans: 2 },
            { id: 24, q: "Trong nội dung xây dựng kinh tế thời kỳ quá độ lên chủ nghĩa xã hội, Hồ Chí Minh đã chủ trương xây dựng những cơ cấu kinh tế nào?", opts: ["A. Cơ cấu ngành", "B. Cơ cấu thành phần", "C. Cơ cấu vùng, lãnh thổ", "D. Tất cả phương án"], ans: 3 },
            { id: 25, q: "Trong quá trình nghiên cứu lý luân Mác-Lênin và thực tế đấu tranh, dần dần Nguyễn Ái Quốc đã hiểu ra được điều gì rất quan trọng về con đường cứu nước?", opts: ["A. Chỉ có chủ nghĩa xã hội, chủ nghĩa cộng sản mới giải phóng được các dân tộc bị áp bức và những người lao động trên thế giới khỏi ách đô hộ", "B. Chỉ có con đường cách mạng tư sản mới giải phóng được các dân tộc bị áp bức", "C. Chỉ có học tập theo cách mệnh Mỹ", "D. Chỉ có đi theo CMT10 Nga"], ans: 0 },
            { id: 26, q: "Trong tác phẩm Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, theo quan điểm của Hồ Chí Minh một trong những yêu cầu mà mỗi cán bộ đảng viên cần phải làm để nâng cao đạo đức cách mạng là:", opts: ["A. Phải đặt lợi ích của cách mạng, của giai cấp nông dân lên trên hết", "B. Phải đặt lợi ích của cách mạng, của các giai cắp lên trên hết, trước hết", "C. Phải đặt lợi ích của cách mạng, của giai cắp công nhân lên trên hết", "D. Phải đặt lợi ích của cách mạng, của Đảng, của nhân dân lên trên hết, trước hết"], ans: 3 },
            { id: 27, q: "Theo Hồ Chí Minh, 'dân là chủ' có nghĩa là:", opts: ["A. Đề cập tới vị thế của dân", "B. Đề cập tới năng lực của dân", "C. Đề cập tới trách nhiệm của dân", "D. Đề cập tới vai trò của dân"], ans: 0 },
            { id: 28, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: “Dân chủ là của quý báu nhất của nhân dân, [...] là cái khóa, cái cửa để đề phòng kẻ phá hoại. Thế thì dân chủ cũng cần phải có chuyên chính để giữ gìn lấy dân chủ”.", opts: ["A. Cách mạng", "B. Chuyên chính", "C. Nhà nước", "D. Chính quyền"], ans: 1 },
            { id: 29, q: "Nguyên tắc quan trọng bậc nhất trong xây dựng một nền đạo đức mới theo tư tưởng Hồ Chí Minh là:", opts: ["A. Nói đi đôi với làm, phải nêu gương về đạo đức", "B. Xây đi đôi với chống", "C. Tu dưỡng đạo đức suốt đời", "D. Phải tạo thành phong trào quần chúng rộng rãi"], ans: 0 },
            { id: 30, q: "Hoàn chỉnh câu sau: 'Chủ nghĩa Lênin đối với chúng ta, những người cách mạng và nhân dân Việt Nam, không những là [...], không những là cái kim chỉ nam, mà còn là mặt trời soi sáng con đường chúng ta đi tới thắng lợi cuối cùng, đi tới chủ nghĩa xã hội và chủ nghĩa cộng sản'.", opts: ["A. Lý luận thần kỳ", "B. Định hướng thần kỳ", "C. Cái cẩm nang thần kỳ", "D. Học thuyết thần kỳ"], ans: 2 },
            { id: 31, q: "Hồ Chí Minh đã khẳng định: “Khổng Tử, Giêxu, Mác, Tôn Dật Tiên có điểm chung là:", opts: ["A. Là những người có tầm ảnh hưởng lớn", "B. Là những nhà tư tưởng lỗi lạc", "C. Mưu cầu hạnh phúc cho loài người, mưu phúc lợi cho xã hội", "D. Yêu nước, thương dân"], ans: 2 },
            { id: 32, q: "Ngày 6/6/1938, Hồ Chí Minh gửi thư cho một lãnh đạo Quốc tế Cộng sản và đề nghị về điều gì?", opts: ["A. Được trở thành Trưởng Ban nghiên cứu thuộc địa", "B. Được hoạt động ở nước ngoài", "C. Được trở về nước để hoạt động", "D. Tiếp tục học và nghiên cứu"], ans: 2 },
            { id: 33, q: "Hoàn chỉnh câu sau: Trong bản Di chúc, điều mong muốn cuối cùng của Hồ Chí Minh là xây dựng một nước Việt Nam [...]", opts: ["A. Dân chủ và giàu mạnh, góp phần xứng đáng vào sự nghiệp cách mạng thế giới", "B. Tất cả phương án", "C. Thống nhất, độc lập", "D. Hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh..."], ans: 3 },
            { id: 34, q: "Trong phát triển kinh tế, Hồ Chí Minh nhấn mạnh việc tăng năng suất lao động phải dựa trên cơ sở:", opts: ["A. Tiến hành tập thể hóa xã hội chủ nghĩa", "B. Tiến hành công nghiệp hóa xã hội chủ nghĩa", "C. Tiến hành công nghiệp, nông nghiệp và thương nghiệp", "D. Tiến hành công nghiệp và nông nghiệp"], ans: 1 },
            { id: 35, q: "Hồ Chí Minh nói 'Dân khí mạnh thì quân lính nào, súng ống nào cũng không chống lại nổi' là nhằm khẳng định vai trò quan trọng của ai trong đấu tranh cách mạng?", opts: ["A. Quần chúng nhân dân", "B. Liên minh giữa giai cấp công nhân với nông dân", "C. Giai cấp công nhân", "D. Giai cấp nông dân"], ans: 0 },
            { id: 36, q: "Hồ Chí Minh dùng hình tượng gì để nói về mối quan hệ cách mạng giải phóng dân tộc ở thuộc địa và cách mạng vô sản ở chính quốc?", opts: ["A. Con bạch tuộc", "B. Hai con chim đại bàng", "C. Hai cái cánh của con chim", "D. Con đỉa hai vòi"], ans: 2 },
            { id: 37, q: "Thời kỳ Hồ Chí Minh vượt qua thử thách, kiên định giữ vững đường lối, phương pháp cách mạng Việt Nam đúng đắn, sáng tạo là:", opts: ["A. Thời kỳ từ năm 1921-1930", "B. Thời kỳ từ năm 1941-1969", "C. Thời kỳ từ năm 1911-1920", "D. Thời kỳ từ năm 1930-1941"], ans: 3 },
            { id: 38, q: "Hoàn chỉnh định nghĩa tư tưởng Hồ Chí Minh: “Tư tưởng Hồ Chí Minh...; là kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác-Lênin vào điều kiện cụ thể của nước ta [...]...”", opts: ["A. Kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hóa nhân loại", "B. Phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hóa phương Đông", "C. Kế thừa các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hóa phương Tây", "D. Tiếp thu tinh hoa văn hóa nhân loại"], ans: 0 },
            { id: 39, q: "'Công nông là gốc cách mạng, còn học trò, nhà buôn nhỏ, điền chủ nhỏ cũng bị tư bản áp bức, song không cực khổ bằng công nông; 3 hạng ấy chỉ là bầu bạn cách mệnh của công nông thôi', quan điểm trên đề cập đến vấn đề gì?", opts: ["A. Lực lượng cách mạng", "B. Mục tiêu của cách mạng", "C. Phương pháp cách mạng", "D. Nhiệm vụ cách mạng"], ans: 0 },
            { id: 40, q: "Nguyên nhân trực tiếp dẫn đến sự thất bại của các phong trào yêu nước theo khuynh hướng dân chủ tư sản là gì?", opts: ["A. Do giai cấp tư sản chưa đủ lực lượng", "B. Chưa có đường lối và phương pháp cách mạng đúng đắn", "C. Do giai cấp tư sản Việt Nam còn non yếu", "D. Các tổ chức, giai cấp không có người đứng đầu lãnh đạo, hệ tư tưởng không phù hợp"], ans: 1 },
            { id: 41, q: "Hoàn chỉnh câu sau: 'Tôi chỉ có một sự ham muốn, ham muốn tột bậc, là làm sao cho nước ta được hoàn toàn độc lập, dân ta được hoàn toàn tự do, đồng bào ai cũng có [...]'", opts: ["A. Độc lập, tự do", "B. Tất cả phương án", "C. Hạnh phúc", "D. Cơm ăn áo mặc, ai cũng được học hành"], ans: 3 },
            { id: 42, q: "Hồ Chí Minh đã tiếp thu giá trị tích cực nào trong bản Tuyên ngôn độc lập nước Mỹ (1776)?", opts: ["A. Những giá trị về quyền sống, quyền tự do, quyền mưu cầu hạnh phúc", "B. Những giá trị về quyền tự do, quyền sung sướng, quyền mưu cầu hạnh phúc", "C. Những giá trị về tự do, bình đẳng, bác ái", "D. Những giá trị về dân chủ, tự do, hạnh phúc"], ans: 0 },
            { id: 43, q: "Quan điểm của Hồ Chí Minh đối với những nhà tư sản công thương trong phát triển kinh tế nhiều thành phần là:", opts: ["A. Không xóa bỏ quyền sở hữu về tư liệu sản xuất và của cải khác của họ; hướng dẫn họ hoạt động làm lợi cho quốc kế dân sinh...", "B. Đánh đổ họ với tư cách là một giai cấp bóc lột", "C. Xóa bỏ quyền sở hữu về tư liệu sản xuất của họ, đưa họ vào kinh tế tập thể", "D. Bảo hộ quyền sở hữu về tư liệu sản xuất, ra sức hướng dẫn và giúp họ cải tiến cách làm ăn..."], ans: 0 },
            { id: 44, q: "Đáp án nào dưới đây đề cập đến ý nghĩa của việc học tập môn học Tư tưởng Hồ Chí Minh đối với sinh viên?", opts: ["A. Kiên định mục tiêu và con đường cách mạng mà Hồ Chí Minh đã xác định", "B. Phát huy sức mạnh dân chủ trong xã hội", "C. Tinh thần đấu tranh chống chủ nghĩa đế quốc", "D. Bồi dưỡng phẩm chất đạo đức cách mạng và rèn luyện bản lĩnh chính trị"], ans: 3 },
            { id: 45, q: "Theo Hồ Chí Minh, nguyên tắc phân phối trong chủ nghĩa xã hội là:", opts: ["A. Làm theo năng lực, hưởng theo nhu cầu", "B. Phân phối theo lao động", "C. Làm theo năng lực, hưởng theo lao động", "D. Phân phối bình quân cho tất cả mọi người"], ans: 2 },
            { id: 46, q: "Hồ Chí Minh kế thừa, đổi mới tư tưởng nào của Nho giáo để quản lý xã hội?", opts: ["A. Tư tưởng nhân trị, pháp trị", "B. Đức trị, pháp trị", "C. Tư tưởng nhân trị, đức trị", "D. Tư tưởng nhân văn"], ans: 2 },
            { id: 47, q: "Sự kiện nào làm cho Nguyễn Ái Quốc hoàn toàn tin theo Lênin, tin theo Quốc tế thứ ba?", opts: ["A. Thất bại của chủ nghĩa thực dân - đế quốc trên toàn thế giới", "B. Đọc Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa", "C. Tất cả phương án", "D. Sự thành công của cách mạng do Quốc tế thứ II lãnh đạo"], ans: 1 },
            { id: 48, q: "Trong nghiên cứu tư tưởng Hồ Chí Minh, ngoài các phương pháp luận chung, cần đặc biệt chú ý sử dụng các phương pháp cụ thể nào?", opts: ["A. Phương pháp lịch sử, logic, phân tích, tổng hợp, thống kê, trắc lượng, văn bản học, điều tra điền dã...", "B. Phân tích, tổng hợp, thống kê, trắc lượng...", "C. Phương pháp liên ngành khoa học xã hội nhân văn, lý luận chính trị", "D. Phương pháp lịch sử, logic, liên ngành, so sánh, đối chiếu"], ans: 0 },
            { id: 49, q: "Theo Hồ Chí Minh, cách mạng giải phóng dân tộc phải được tiến hành một cách chủ động, sáng tạo và có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc, bởi vì:", opts: ["A. Các nước thuộc địa có sự giúp đỡ của Quốc tế cộng sản", "B. Lực lượng cách mạng ở thuộc địa đông và mạnh hơn lực lượng cách mạng ở chính quốc", "C. Nọc độc và sức sống của con rắn độc tư bản chủ nghĩa đang tập trung ở các thuộc địa hơn ở chính quốc", "D. Kẻ thù ở thuộc địa yếu hơn kẻ thù của giai cấp vô sản ở chính quốc"], ans: 2 },
            { id: 50, q: "Trong Chính cương vắn tắt, Hồ Chí Minh xác định phương hướng chiến lược của cách mạng Việt Nam như thế nào?", opts: ["A. Làm tư sản dân quyền cách mạng để đi tới xã hội cộng sản", "B. Làm cách mạnh tư sản và thổ địa cách mạng để đi tới xây dựng chủ nghĩa tư bản", "C. Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội tư bản", "D. Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản"], ans: 3 },
            { id: 51, q: "Hoàn chỉnh câu sau: 'Nước Việt Nam có quyền hưởng [1] và sự thực đã thành một nước [2]. Toàn thể dân Việt Nam quyết đem tất cả tinh thần và lực lượng, tính mạng và của cải để giữ vững quyền [3] ấy'.", opts: ["A. Tự do và độc lập", "B. Độc lập và bình đẳng", "C. Độc lập và tự do", "D. Tự do và hạnh phúc"], ans: 0 },
            { id: 52, q: "Nội dung nào thể hiện sự khác biệt trong quan điểm về độc lập dân tộc của Hồ Chí Minh và nhà cách mạng Tôn Trung Sơn?", opts: ["A. Độc lập cho các dân tộc", "B. Độc lập dân tộc thuộc địa, độc lập dân tộc gắn liền với chủ nghĩa xã hội", "C. Độc lập cho nhân dân lao động...", "D. Độc lập dân tộc gắn liền với chủ nghĩa xã hội, quá trình cách mạng đó phải dưới sự lãnh đạo của giai cấp công nhân..."], ans: 3 },
            { id: 53, q: "Hoàn chỉnh câu sau: 'Chỉ có chủ nghĩa cộng sản mới cứu [...] đem lại cho mọi người không phân biệt chủng tộc và nguồn gốc sự tự do, bình đẳng, bác ái, đoàn kết, ấm no trên quả đất...'", opts: ["A. Loài người", "B. Nhân dân", "C. Nhân loại", "D. Con người"], ans: 2 },
            { id: 54, q: "Trong nội dung xây dựng kinh tế thời kỳ quá độ lên chủ nghĩa xã hội, Hồ Chí Minh đã chủ trương xây dựng những cơ cấu nào?", opts: ["A. Cơ cấu kinh tế ngành, cơ cấu các thành phần kinh tế, cơ cấu vùng kinh tế", "B. Cơ cấu các thành phần kinh tế, cơ cấu vùng kinh tế và lãnh thổ", "C. Cơ cấu kinh tế ngành, cơ cấu các thành phần kinh tế, cơ cấu vùng kinh tế và lãnh thổ", "D. Cơ cấu vùng kinh tế và lãnh thổ, cơ cấu kinh tế ngành"], ans: 2 },
            { id: 55, q: "Tổ chức Quốc tế cộng sản được thành lập vào thời gian nào?", opts: ["A. Tháng 4/1917", "B. Tháng 2/1920", "C. Tháng 3/1919", "D. Tháng 5/1918"], ans: 2 },
            { id: 56, q: "Theo Hồ Chí Minh, trong quá trình cách mạng xã hội chủ nghĩa, chúngta phải cải tạo nền kinh tế cũ và xây dựng nền kinh tế mới mà:", opts: ["A. Cải tạo xã hội cũ và xây dựng xã hội mới đều là nhiệm vụ trọng tâm", "B. Cải tạo nền kinh tế cũ là nhiệm vụ trung tâm, chủ chốt", "C. Cải tạo nền kinh tế cũ là chủ yếu", "D. Xây dựng là nhiệm vụ chủ chốt và lâu dài"], ans: 3 },
            { id: 57, q: "Hoàn chỉnh câu sau: 'Nước [...] mà dân không hưởng [...] tự do, thì [...] cũng chẳng có ý nghĩa gì'", opts: ["A. Độc lập - hạnh phúc - tự do", "B. Độc lập - tự do - hạnh phúc", "C. Độc lập - dân chủ - độc lập", "D. Độc lập - hạnh phúc - độc lập"], ans: 1 },
            { id: 58, q: "Hoàn chỉnh câu sau: 'Bộ phận nào mà ra mặt phản cách mạng [...] thì phải đánh đổ'. (Trong tác phẩm “Sách lược vắn tắt của Đảng”).", opts: ["A. Đảng Việt Cách", "B. Đảng Lập hiến", "C. Việt Nam Quốc dân đảng", "D. Tân Việt Cách mạng đảng"], ans: 1 },
            { id: 59, q: "Hoàn chỉnh câu sau: 'Động lực văn hóa, khoa học, giáo dục là động lực [...] không thể thiếu của chủ nghĩa xã hội'.", opts: ["A. Quan trọng", "B. Tinh thần", "C. Vật chất và tinh thần", "D. Vật chất"], ans: 1 },
            { id: 60, q: "Hồ Chí Minh lựa chọn con đường cách mạng vô sản dựa trên cơ sở nào?", opts: ["A. Tất cả phương án", "B. Nghiên cứu, khảo nghiệm các xu hướng, ngả đường cách mạng lớn trên thế giới trong hành trình tìm đường cứu nước", "C. Nghiên cứu và tiếp thu lý luận của chủ nghĩa Mác-Lênin", "D. Thực tiễn nghiên cứu, phân tích những phong trào cách mạng ở trong nước cuối thế kỷ XIX, đầu thế kỷ XX"], ans: 0 },
            { id: 61, q: "Hoàn chỉnh câu sau: 'Bây giờ học thuyết nhiều, chủ nghĩa nhiều, nhưng chủ nghĩa [...] là chủ nghĩa Lênin'", opts: ["A. Cách mệnh nhất, chắc chắn nhất", "B. Khoa học nhất", "C. Chân chính nhất, cách mệnh nhất", "D. Chân chính nhất, chắc chắn nhất, cách mệnh nhất"], ans: 3 },
            { id: 62, q: "Hoàn chỉnh câu sau: Tư tưởng Hồ Chí Minh mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với giải phóng giai cấp và [...]", opts: ["A. Giải phóng người cùng khổ", "B. Giải phóng con người", "C. Giải phóng người nô lệ", "D. Giải phóng người bị áp bức"], ans: 1 },
            { id: 63, q: "Hoàn chỉnh câu sau: 'Nền kinh tế mà chúng ta xây dựng cần phải phát triển toàn diện ngành chủ yếu là: công - nông - thương nghiệp; trong đó [...] là hai cái chân của nền kinh tế nước nhà'", opts: ["A. Nông nghiệp và công nghiệp nhẹ", "B. Công nghiệp và nông nghiệp", "C. Công nghiệp nặng và nông nghiệp", "D. Nông nghiệp và thương nghiệp"], ans: 1 },
            { id: 64, q: "Điểm giống và khác nhau giữa hai giai đoạn của “Cộng sản” (Trong tác phẩm Thưởng thức chính trị) là gì?", opts: ["A. Chủ nghĩa xã hội vẫn còn chút ít vết tích của xã hội cũ, xã hội cộng sản thì hoàn toàn không còn vết tích của xã hội cũ", "B. Chủ nghĩa xã hội là tư bản, địa chủ không còn nữa...", "C. Chủ nghĩa xã hội là tư liệu sản xuất tập trung...", "D. Chủ nghĩa xã hội không còn vết tích của xã hội cũ..."], ans: 0 },
            { id: 65, q: "Đại hội nào của Đảng xác định khá toàn diện, có hệ thống những vấn đề cốt yếu thuộc nội hàm niệm tư tưởng Hồ Chí Minh?", opts: ["A. Đại hội Đại biểu toàn quốc lần thứ XI (2011)", "B. Đại hội Đại biểu toàn quốc lần thứ IX (2001)", "C. Đại hội Đại biểu toàn quốc lần thứ VII (1991)", "D. Đại hội Đại biểu toàn quốc lần thứ VIII (1996)"], ans: 1 },
            { id: 66, q: "Hoàn chỉnh câu sau: 'Khi tôi độ [...] lần đầu tiên tôi được nghe ba chữ Pháp: Tự do, Bình đẳng, Bác ái...'", opts: ["A. Mười lăm tuổi", "B. Mười ba tuổi", "C. Mười bốn tuổi", "D. Mười sáu tuổi"], ans: 1 },
            { id: 67, q: "Sau thời gian hoạt động ở Pháp, tháng 6/1923 Nguyễn Ái Quốc bắt đầu hoạt động ở đâu?", opts: ["A. Mỹ", "B. Đức", "C. Liên Xô", "D. Anh"], ans: 2 },
            { id: 68, q: "Hoàn chỉnh câu sau: “Dân ta có một lòng nồng nàn yêu nước. Đó là một truyền thống quý báu của ta. Từ xưa đến nay, [1] thì tinh thần ấy lại [2]...'", opts: ["A. Mỗi khi Tổ quốc bị xâm lược - trỗi dậy", "B. Hễ Tổ quốc bị xâm lăng - sôi nổi", "C. Mỗi khi Tổ quốc bị xâm lăng - sôi nổi", "D. Khi Tổ quốc bị ngoại xâm - trỗi dậy"], ans: 1 },
            { id: 69, q: "Hoàn chỉnh câu sau: 'Người ta sinh ra tự do và bình đẳng về quyền lợi, và phải luôn luôn được tự do và bình đẳng về quyền lợi. Đó là [...]'.", opts: ["A. Những lẽ phải không ai chối cãi được", "B. Là quyền thiêng liêng, bất khả xâm phạm", "C. Là điều không ai chối cãi được", "D. Là lẽ phải không ai chối cãi được"], ans: 3 },
            { id: 70, q: "Theo Hồ Chí Minh: 'Sức mạnh vô địch của Đảng là ở tinh thần kỷ luật tự giác, ý thức tổ chức nghiêm chỉnh của cán bộ, đảng viên'. Câu nói trên đề cập đến nguyên tắc nào?", opts: ["A. Tập thể lãnh đạo, cá nhân phụ trách", "B. Tự phê bình và phê bình", "C. Đoàn kết thống nhất trong Đảng", "D. Kỷ luật nghiêm minh, tự giác"], ans: 3 },
            { id: 71, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: “Đảng có vững, [...] mới thành công, cũng như người cầm lái có vững thì [...]”", opts: ["A. Cách mệnh, thuyền mới chạy", "B. Kháng chiến, tàu mới chạy", "C. Cách mạng, tàu mới đi", "D. Cách mệnh, thuyền chạy"], ans: 0 },
            { id: 72, q: "Tác phẩm nào sau đây của Hồ Chí Minh đề cập đến giáo dục, rèn luyện toàn diện đội ngũ cán bộ cách mạng của Đảng, của Nhà nước ta, được xuất bản năm 1947?", opts: ["A. Bản án chế độ thực dân Pháp", "B. Con đường dẫn tôi đến Chủ nghĩa Mác-Lênin", "C. Sửa đổi lối làm việc", "D. Đường Cách mệnh"], ans: 2 },
            { id: 73, q: "Khẳng định sự cần thiết của việc xây dựng khối liên minh chiến đấu giữa các dân tộc thuộc địa... Khối liên minh này sẽ là một trong những [...]", opts: ["A. Cái cánh của máy bay", "B. Cái cánh của một con chim", "C. Cánh tay của một con người", "D. Cái cánh của cách mạng vô sản"], ans: 3 },
            { id: 74, q: "Nhà nước pháp quyền nhân nghĩa là nhà nước tôn trọng, bảo đảm thực hiện đầy đủ các quyền [...]", opts: ["A. Dân tộc", "B. Giai cấp", "C. Dân chủ", "D. Con người"], ans: 3 },
            { id: 75, q: "Trong các giá trị truyền thống của dân tộc Việt Nam, giá trị nào được coi là dòng chảy chính trong truyền thống văn hóa dân tộc, là cội nguồn trí tuệ?", opts: ["A. Dũng cảm, sáng tạo", "B. Chủ nghĩa yêu nước", "C. Lòng yêu thương con người", "D. Đoàn kết dân tộc"], ans: 1 },
            { id: 76, q: "Đâu là nội dung không đúng theo tư tưởng Hồ Chí Minh về mục tiêu kinh tế trong xây dựng chủ nghĩa xã hội?", opts: ["A. Nền công nghiệp hiện đại", "B. Xây dựng một Nhà nước hiện đại", "C. Nền nông nghiệp hiện đại", "D. Khoa học kỹ thuật tiên tiến"], ans: 1 },
            { id: 77, q: "Hội nghị lần thứ nhất BCH Trung ương lâm thời của Đảng (10-1930), đã chỉ trích và phê phán đường lối của Nguyễn Ái Quốc trong Chính cương vắn tắt, Sách lược vắn tắt như thế nào?", opts: ["A. Mang nặng cốt cách phong kiến", "B. Chẳng khác gì là 'đuổi hổ cửa trước, rước beo cửa sau'", "C. Chẳng khác nào xin giặc rủ lòng thương", "D. Chỉ lo đến việc phản đế, mà quên mất lợi ích giai cấp tranh đấu"], ans: 3 },
            { id: 78, q: "Trước cách mạng Tháng Tám, Hồ Chí Minh định hướng xây dựng nền văn hóa trên những lĩnh vực nào?", opts: ["A. Kinh tế, chính trị, văn hóa, xã hội và luân lý", "B. Kinh tế, chính trị, văn hóa, xã hội và tâm lý", "C. Tâm lý, luân lý, xã hội, chính trị và kinh tế", "D. Tâm lý, văn hóa, xã hội, luân lý và kinh tế"], ans: 3 },
            { id: 79, q: "Làm cho các dân tộc thuộc địa, từ trước tới nay vẫn [...], hiểu biết nhau hơn và đoàn kết lại... khối [...] này sẽ là một trong những cái cánh của cách mạng vô sản.", opts: ["A. Chưa hiểu nhau; liên minh", "B. Xa cách nhau; đoàn kết", "C. Cách biệt nhau; liên minh", "D. Hiểu lầm nhau; đoàn kết"], ans: 2 },
            { id: 80, q: "Theo Chủ tịch Hồ Chí Minh bao nhiêu những cái xấu xa, thối nát, bất công, áp bức của chế độ cũ... sẽ không thể tồn tại ở đâu hiện nay?", opts: ["A. Ủy ban thường vụ Trung ương Đảng", "B. Tất cả phương án", "C. Ủy ban nhân dân", "D. Ủy ban kháng chiến"], ans: 2 },
            { id: 81, q: "Trong các luận điểm sau, luận điểm nào không phải của Hồ Chí Minh khi nói về điểm giống và khác nhau giữa hai giai đoạn của “Cộng sản”?", opts: ["A. Chủ nghĩa xã hội không còn vết tích của xã hội cũ...", "B. Chủ nghĩa xã hội là tư liệu sản xuất tập trung...", "C. Chủ nghĩa xã hội là tư bản, địa chủ không còn nữa...", "D. Chủ nghĩa xã hội vẫn còn chút ít vết tích..."], ans: 0 },
            { id: 82, q: "Để tăng cường tính nghiêm minh của pháp luật đi đôi với đẩy mạnh giáo dục đạo đức, Hồ Chí Mình đã kết hợp nhuần nhuyễn giữa:", opts: ["A. 'Đức trị' và 'nhân trị'", "B. 'Nhân trị' và 'pháp trị'", "C. 'Đức trị' và 'pháp trị'", "D. 'Pháp trị' và 'dân trị'"], ans: 2 },
            { id: 83, q: "Nhân dân có quyền lợi làm chủ, thì phải có nghĩa vụ làm tròn bổn phận công dân, giữ đúng [...] công dân.", opts: ["A. Đạo đức", "B. Tư cách", "C. Bổn phận", "D. Trách nhiệm"], ans: 0 },
            { id: 84, q: "Quan điểm của Hồ Chí Minh đối với người làm nghề thủ công và lao động riêng lẻ khác trong phát triển kinh tế nhiều thành phần là:", opts: ["A. Nhà nước cần đặc biệt khuyến khích họ...", "B. Không xóa bỏ quyền sở hữu về tư liệu sản xuất...", "C. Cần ưu tiên để tạo nền tảng vật chất...", "D. Nhà nước bảo hộ quyền sở hữu về tư liệu sản xuất, ra sức hướng dẫn và giúp họ cải tiến cách làm ăn..."], ans: 3 },
            { id: 85, q: "Khối liên minh này sẽ là một trong những [...]", opts: ["A. Cái cánh của cách mạng vô sản", "B. Yếu tố quyết định của cách mạng vô sản", "C. Nền tảng của cách mạng vô sản", "D. Điều kiện tiên quyết của cách mạng vô sản"], ans: 0 },
            { id: 86, q: "Chỉ có [...] mới giải phóng được các dân tộc bị áp bức và giai cấp công nhân toàn thế giới", opts: ["A. Chủ nghĩa xã hội", "B. Chủ nghĩa xã hội và chủ nghĩa cộng sản", "C. Chủ nghĩa cộng sản", "D. Chế độ cộng sản"], ans: 1 },
            { id: 87, q: "Theo Hồ Chí Minh, nhiệm vụ quan trọng nhất của thời kỳ quá độ lên chủ nghĩa xã hội là:", opts: ["A. Cải tạo xã hội cũ, xây dựng xã hội mới", "B. Xây dựng tiền đề về kinh tế, chính trị, văn hóa, tư tưởng...", "C. Xây dựng nền tảng vật chất và kỹ thuật của chủ nghĩa xã hội", "D. Tất cả phương án"], ans: 2 },
            { id: 88, q: "Quan điểm “chỉ có thể thực hiện hoàn toàn công cuộc giải phóng các nước thuộc địa khi giai cấp vô sản giành được thắng lợi ở các nước tư bản tiên tiến” đánh giá thế nào?", opts: ["A. Cách mạng thuộc địa có thể nổ ra và giành thắng lợi trước", "B. Cách mạng thuộc địa phụ thuộc vào cách mạng vô sản ở chính quốc", "C. Cách mạng vô sản ở chính quốc phụ thuộc cách mạng thuộc địa", "D. Cách mạng thuộc địa không phụ thuộc..."], ans: 1 },
            { id: 89, q: "Hồ Chí Minh kế thừa, phát triển những tư tưởng nào của Phật giáo vào việc xây dựng xã hội mới, con người mới Việt Nam?", opts: ["A. Tư tưởng nhân văn, nhân bản", "B. Tư tưởng nhân văn, đạo đức", "C. Tư tưởng nhân bản, đạo đức tích cực", "D. Tư tưởng nhân văn, pháp trị"], ans: 2 },
            { id: 90, q: "Muốn cải tạo xã hội chủ nghĩa thì phải cải tạo chính mình, nếu không có tư tưởng xã hội chủ nghĩa thì [...]", opts: ["A. Không có nền kinh tế phát triển", "B. Tất cả phương án", "C. Không làm việc xã hội chủ nghĩa được", "D. Không có khoa học kỹ thuật tiên tiến"], ans: 2 },
            { id: 91, q: "Khái niệm tư tưởng Hồ Chí Minh do Đại hội XI nêu ra làm rõ được những nội dung mới nào?", opts: ["A. Bản chất cách mạng, khoa học, cơ sở hình thành...", "B. Bản chất cách mạng, khoa học, cơ sở hình thành, nội dung cơ bản và giá trị, ý nghĩa trường tồn...", "C. Hệ thống quan điểm toàn diện...", "D. Nội dung cơ bản thuộc nội hàm..."], ans: 1 },
            { id: 92, q: "Hồ Chí Minh khẳng định như thế nào về con đường cách mạng Việt Nam?", opts: ["A. Hoàn thành cách mạng dân tộc, dân chủ nhân dân, tiến nhanh lên CNXH", "B. Tiến hành giải phóng dân tộc và đi lên CNTB", "C. Tiến hành giải phóng dân tộc, hoàn thành cách mạng DTDCND tiến nhanh lên CNTB", "D. Tiến hành giải phóng dân tộc, hoàn thành cách mạng DTDCND tiến dần lên CNXH"], ans: 3 },
            { id: 93, q: "Tìm câu chưa chính xác khi nói về tính khoa học của nền văn hóa mới theo tư tưởng Hồ Chí Minh:", opts: ["A. Tính khoa học biểu hiện kế thừa truyền thống...", "B. Tính khoa học là phải truyền bá tư tưởng triết học...", "C. Tính khoa học là tính tiên tiến nhưng chưa cần thuận với trào lưu tiến hóa của thời đại.", "D. Tính khoa học là phải đấu tranh chống lại những gì trái khoa học..."], ans: 2 },
            { id: 94, q: "Trong đoàn kết với các dân tộc, Hồ Chí Minh nhấn mạnh: 'Đồng bào tất cả các dân tộc, không phân biệt... thương yêu giúp đỡ lẫn nhau phải [...] như anh em một nhà...'", opts: ["A. Đoàn kết chặt chẽ.", "B. Đoàn kết lâu dài.", "C. Đoàn kết chân thành.", "D. Đoàn kết hợp tác."], ans: 0 },
            { id: 95, q: "Trong mấy điểm lớn trong Chính sách cán bộ, theo Hồ Chí Minh cần phải chú ý những gì?", opts: ["A. Hiểu biết cán bộ khéo dùng cán bộ, cất nhắc cán bộ, thương yêu cán bộ, phê bình cán bộ.", "B. Khéo dùng cán bộ, cất nhắc cán bộ.", "C. Hiểu biết cán bộ.", "D. Thương yêu và phê bình cán bộ."], ans: 0 },
            { id: 96, q: "Phải chú trọng 'đạo làm gương', bởi vì theo Hồ Chí Minh, “Đối với các dân tộc phương Đông... một tấm gương sống còn có giá trị hơn [...]”", opts: ["A. Một trăm bài diễn văn tuyên truyền.", "B. Hàng trăm bài diễn văn tuyên truyền.", "C. Một trăm tủ sách.", "D. Hàng trăm hòm vàng."], ans: 0 },
            { id: 97, q: "Theo Hồ Chí Minh, mục đích của phê bình và tự phê bình là gì?", opts: ["A. Cốt để giúp nhau sửa chữa, giúp nhau tiến bộ. Cốt để đổi cách làm việc cho tốt hơn, đúng hơn. Cốt để đoàn kết và thống nhất nội bộ.", "B. Thêm bớt khuyết điểm của nhau.", "C. Giấu giếm khuyết điểm cho nhau.", "D. Nịnh người trên, xem khinh người dưới."], ans: 0 },
            { id: 98, q: "Đâu là nhân tố thể hiện sự sáng tạo của Hồ Chí Minh trong quy luật ra đời của Đảng Cộng sản Việt Nam.", opts: ["A. Phong trào công nhân.", "B. Tất cả phương án.", "C. Phong trào yêu nước.", "D. Chủ nghĩa Mác Lênin."], ans: 2 },
            { id: 99, q: "Chúng ta là những người lao động làm chủ nước nhà. Muốn làm chủ được tốt, phải có [...] làm chủ", opts: ["A. Tư cách.", "B. Tác phong.", "C. Quyết tâm.", "D. Năng lực."], ans: 3 },
            { id: 100, q: "Theo Hồ Chí Minh, cách mạng giải phóng dân tộc là việc chung của cả dân chúng chứ không phải việc của [...].", opts: ["A. Một vài người.", "B. Một người.", "C. Một hai người.", "D. Một nhóm người."], ans: 2 },
            { id: 101, q: "Trong Sách lược vắn tắt, Hồ Chí Minh xác định: Đảng cần phải liên lạc với bộ phận giai cấp nào trong xã hội?", opts: ["A. Tiểu tư sản, trí thức, trung nông, Thanh niên, Tân Việt.", "B. Phú nông, trung, tiểu địa chủ và tri thức An Nam.", "C. Phú nông, tư bản An Nam.", "D. Trung, tiểu địa chủ."], ans: 1 },
            { id: 102, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: 'Tư tưởng Hồ Chí Minh góp phần tích cực vào cuộc đấu tranh vì [...]'.", opts: ["A. Độc lập, tự do của các dân tộc bị áp bức.", "B. Tự do, ấm no của các dân tộc.", "C. Hòa bình và công lý.", "D. Độc lập dân tộc, dân chủ, hòa bình, hợp tác và phát triển trên thế giới."], ans: 3 },
            { id: 103, q: "Con đường cách mạng của ai được Hồ Chí Minh đánh giá là 'chẳng khác nào xin giặc rủ lòng thương'?", opts: ["A. Phan Bội Châu.", "B. Nguyễn Thái Học.", "C. Hoàng Hoa Thám.", "D. Phan Chu Trinh."], ans: 3 },
            { id: 104, q: "Hồ Chí Minh cho rằng lực lượng của giai cấp công nhân và nhân dân lao động là:", opts: ["A. To lớn, mạnh mẽ.", "B. Vô cùng vô tận.", "C. Vô cùng mạnh mẽ.", "D. Vô cùng to lớn."], ans: 3 },
            { id: 105, q: "Câu 'Chủ trương làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản' được trích từ văn kiện nào của Hồ Chí Minh?", opts: ["A. Chương trình tóm tắt.", "B. Đường cách mệnh.", "C. Chính cương vắn tắt.", "D. Sách lược vắn tắt."], ans: 2 },
            { id: 106, q: "Chọn đáp án đúng nhất theo Hồ Chí Minh: Đặc điểm to nhất của ta khi quá độ lên chủ nghĩa xã hội là:", opts: ["A. Từ một nước công nghiệp tiến thẳng lên chủ nghĩa xã hội...", "B. Từ một nước nông nghiệp trung bình...", "C. Từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa.", "D. Từ một nước nông nghiệp phát triển..."], ans: 2 },
            { id: 107, q: "Theo Hồ Chí Minh, 'Là người đầy tớ của dân', có nghĩa là phải?", opts: ["A. Thực hiện theo yêu cầu của quần chúng.", "B. Luôn lắng nghe và thực hiện theo yêu cầu của quần chúng.", "C. Tận tâm, tận lực phụng sự nhân dân nhằm đem lại các quyền lợi và lợi ích cho nhân dân.", "D. Luôn nghe theo quần chúng."], ans: 2 },
            { id: 108, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo Hồ Chí Minh, đặc điểm to nhất của ta khi quá độ lên chủ nghĩa xã hội là từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội [...].", opts: ["A. Không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa.", "B. Không bỏ qua giai đoạn phát triển tư bản chủ nghĩa.", "C. Kinh qua giai đoạn phát triển tư bản chủ nghĩa.", "D. Có sự giúp sức của nhiều nước trên thế giới."], ans: 0 },
            { id: 109, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: 'Đạo đức cách mạng không phải trên trời sa xuống... Cũng như [...] càng mài càng sáng, [...] càng luyện càng trong'.", opts: ["A. Đá - vàng.", "B. Vàng - đá.", "C. Vàng - ngọc.", "D. Ngọc - vàng."], ans: 3 },
            { id: 110, q: "Trong tác phẩm “Chính phủ là công bộc của dân', theo Chủ tịch Hồ Chí Minh, các công việc mà Chính phủ làm phải nhằm vào mục đích gì?", opts: ["A. Mưu cầu hạnh phúc cho mọi người.", "B. Mưu cầu tự do hạnh phúc và việc làm cho mọi người.", "C. Mưu cầu tự do cho mọi người.", "D. Mưu cầu tự do, hạnh phúc cho mọi người."], ans: 3 },
            { id: 111, q: "Đâu là nhân tố thể hiện sự sáng tạo của Hồ Chí Minh trong quy luật ra đời của Đảng Cộng sản Việt Nam?", opts: ["A. Phong trào công nhân.", "B. Tất cả phương án.", "C. Phong trào yêu nước.", "D. Chủ nghĩa Mác - Lênin."], ans: 2 },
            { id: 112, q: "Trong các nguyên tắc xây dựng Đảng, nguyên tắc nào là cơ bản trong xây dựng, tổ chức, hoạt động của Đảng, theo Hồ Chí Minh?", opts: ["A. Tự phê bình và phê bình.", "B. Tập thể lãnh đạo, cá nhân phụ trách.", "C. Kỷ luật nghiêm minh tự giác.", "D. Tập trung dân chủ."], ans: 3 },
            { id: 113, q: "Theo Hồ Chí Minh, thước đo một Nhà nước vì dân là phải được lòng dân. Do đó, với cán bộ nhà nước phải:", opts: ["A. Gần gũi nhân dân khi cần.", "B. Giáo huấn nhân dân.", "C. Làm sao cho được lòng dân, dân tin, dân mến, dân yêu.", "D. Quan cách trước dân."], ans: 2 },
            { id: 114, q: "Theo Hồ Chí Minh, đấu tranh chống chủ nghĩa cá nhân không phải là:", opts: ["A. Giày xéo lên lợi ích cá nhân.", "B. Hy sinh lợi ích cá nhân vì tập thể.", "C. Xóa bỏ lợi ích cá nhân.", "D. Lấy lợi ích cá nhân phục vụ lợi ích tập thể."], ans: 0 },
            { id: 115, q: "Theo Hồ Chí Minh trong các biện pháp xây dựng chủ nghĩa xã hội, biện pháp nào được xác định là cơ bản, quyết định, lâu dài?", opts: ["A. Phải huy động hết các nguồn lực vốn có trong dân để làm lợi cho dân.", "B. Kết hợp xây dựng với bảo vệ tiến hành đồng thời hai nhiệm vụ chiến lược...", "C. Huy động nguồn vốn đầu tư nước ngoài.", "D. Thực hiện cải tạo xã hội cũ, xây dựng xã hội mới."], ans: 0 },
            { id: 116, q: "Theo quan điểm Hồ Chí Minh, lực lượng tiến hành bạo lực cách mạng là gì?", opts: ["A. Giai cấp tư sản và tầng lớp tiểu tư sản.", "B. Quần chúng nhân dân, chủ yếu là lực lượng chính trị và quân sự.", "C. Quần chúng.", "D. Giai cấp công nhân và nông dân."], ans: 1 },
            { id: 117, q: "Theo Hồ Chí Minh mục đích của tiếp thu tinh hoa văn hóa nhân loại là để:", opts: ["A. Làm cho văn hóa Việt Nam ngày càng phong phú.", "B. Làm giàu cho văn hóa Việt Nam, xây dựng văn hóa Việt Nam hợp với tinh thần dân chủ lao động.", "C. Làm cho văn hóa Việt Nam ngày càng hiện đại.", "D. Làm cho nền văn hóa Việt Nam mang tinh thần dân chủ."], ans: 1 },
            { id: 118, q: "Theo Hồ Chí Minh phải nghiêm túc khắc phục các phản động lực trong con người và tổ chức. Đó là:", opts: ["A. Chủ nghĩa cá nhân.", "B. Tư tưởng tư sản.", "C. Phong cách tiểu tư sản.", "D. Chủ nghĩa vị kỷ."], ans: 0 },
            { id: 119, q: "Lòng khoan dung độ lượng ở Hồ Chí Minh không phải là một sách lược nhất thời, một thủ đoạn chính trị mà là sự tiếp nối và phát triển của:", opts: ["A. Mục tiêu cách mạng.", "B. Truyền thống nhân ái, bao dung của dân tộc, từ chính mục tiêu của cuộc cách mạng.", "C. Truyền thống yêu nước của dân tộc...", "D. Chủ nghĩa yêu nước..."], ans: 1 },
            { id: 120, q: "Nguyễn Ái Quốc đến Liên Xô lần đầu năm nào?", opts: ["A. 1925.", "B. 1923.", "C. 1924.", "D. 1921."], ans: 1 },
            { id: 121, q: "'[...] mới gánh được nặng và đi được xa. Người cách mạng phải có [...] làm nền tảng mới hoàn thành được nhiệm vụ cách mạng vẻ vang'.", opts: ["A. Sức có mạnh - cần kiệm liêm chính.", "B. Sức có mạnh - đạo đức cách mạng.", "C. Đạo đức cách mạng - cần kiệm liêm chính.", "D. Sức có mạnh - tinh thần cách mạng."], ans: 2 },
            { id: 122, q: "'Nhân dân có quyền lợi làm chủ, thì phải có nghĩa vụ làm tròn bổn phận công dân, giữ đúng [...] công dân'.", opts: ["A. Đạo đức.", "B. Tư cách.", "C. Bổn phận.", "D. Trách nhiệm."], ans: 1 },
            { id: 123, q: "'Có sức mạnh cả nước một lòng, lại có sự ủng hộ của nhân dân thế giới, chúng sẽ có một [...] tổng hợp cộng với phương pháp cách mạng thích hợp, [...] cách mạng nước ta sẽ đi đến đích cuối cùng'.", opts: ["A. Nền tảng, nhất định.", "B. Sức mạnh, nhất định.", "C. Nền tảng, chắc chắn.", "D. Sức mạnh, chắc chắn."], ans: 1 },
            { id: 124, q: "Trong Bài nói tại buổi khai mạc Đại hội thống nhất Việt Minh - Liên Việt, Hồ Chí Minh khẳng định, khối đại đoàn kết của toàn dân sẽ phát triển thành đại đoàn kết giữa dân ta với những lực lượng nào trên thế giới?", opts: ["A. Nhân dân các nước bạn, Pháp, nhân dân yêu chuộng hòa bình.", "B. Nhân dân ba nước Đông Dương.", "C. Nhân dân Á - Phi - Mỹ Latinh.", "D. Phong trào cộng sản và công nhân quốc tế, phong trào giải phóng dân tộc và các lực lượng yêu chuộng hòa bình, công lý..."], ans: 3 },
            { id: 125, q: "Hồ Chí Minh nói 'Dân khí mạnh thì quân lính nào, súng ống nào cũng không chống lại nổi' là để đánh giá vị trí và vai trò của ai?", opts: ["A. Liên minh giữa giai cấp công nhân với nông dân.", "B. Giai cấp nông dân.", "C. Quần chúng nhân dân.", "D. Giai cấp công nhân."], ans: 2 },
            { id: 126, q: "'Giàu sang không [...] nghèo khó không thế [...] uy vũ không thể [...]'.", opts: ["A. Khuất phục, quyến rũ, chuyển lay.", "B. Chuyển lay, khuất phục, quyến rũ.", "C. Quyến rũ, chuyển lay, khuất phục.", "D. Quyến rũ, chuyển lay, quật ngã."], ans: 2 },
            { id: 127, q: "Chọn phương án sai trong các phương án sau:", opts: ["A. Thời kỳ trước 1911: Hình thành tư tưởng yêu nước và chí hướng cứu nước.", "B. Thời kỳ từ 1920 - 1930: Hình thành về cơ bản tư tưởng về cách mạng Việt Nam.", "C. Thời kỳ từ 1911 - 1920: Tìm thấy con đường cứu nước giải phóng dân tộc.", "D. Thời kỳ từ 1930 - 1941: Tư tưởng Hồ Chí Minh tiếp tục hoàn thiện, phát triển và tỏa sáng."], ans: 3 },
            { id: 128, q: "Việc biểu quyết tán thành Đệ tam quốc tế (Quốc tế thứ III), tham gia thành lập Đảng Cộng sản Pháp (12-1920), đánh dấu bước chuyển biến về:", opts: ["A. Chuyển biến về nhận thức.", "B. Chuyển biến về chất.", "C. Chuyển biến về lượng.", "D. Chuyển biến về cách nhìn nhận..."], ans: 1 },
            { id: 129, q: "Trong cương lĩnh chính trị của Đảng, Hồ Chí Minh xác định mục tiêu chính trị của Đảng là gì?", opts: ["A. Dân chúng được tự do tổ chức, nam nữ được bình quyền...", "B. Đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến, làm cho nước Nam được hoàn toàn độc lập, dựng ra Chính phủ công nông binh...", "C. Thủ tiêu hết quốc trái...", "D. Tư sản dân quyền cách mạng và thổ địa cách mạng dể đi tới xã hội cộng sản."], ans: 1 },
            { id: 130, q: "Theo tư tưởng Hồ Chí Minh trên mặt trận văn hóa [...].", opts: ["A. Văn nghệ sĩ là chiến sĩ, tác phẩm văn nghệ là vũ khí sắc bén trong đấu tranh cách mạng, trong xây dựng xã hội mới, con người mới.", "B. Văn nghệ sĩ là những người đi đầu.", "C. Văn nghệ sĩ là những người hăng hái nhất.", "D. Văn nghệ sĩ là động lực của cuộc cách mạng."], ans: 0 },
            { id: 131, q: "Tìm một câu có nội dung không đúng khi Hồ Chí Minh nói về tính chất khó khăn phức tạp của thời kỳ quá độ lên chủ nghĩa xã hội nước ta:", opts: ["A. Luôn bị các thế lực phản động trong và ngoài nước tìm cách quấy phá.", "B. Đây là cuộc cách mạng làm đảo lộn mọi mặt đời sống xã hội.", "C. Trong sự nghiệp xây dựng chủ nghĩa xã hội, Đảng, nhà nước, nhân dân chưa có kinh nghiệm.", "D. Đây là cuộc cách mạng chỉ làm thay đổi thói quen cũ trong mỗi con người."], ans: 3 },
            { id: 132, q: "Hồ Chí Minh viết tác phẩm Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, nhân kỷ niệm lần thứ bao nhiêu ngày thành lập Đảng?", opts: ["A. 29 năm.", "B. 39 năm.", "C. 19 năm.", "D. 49 năm."], ans: 1 },
            { id: 133, q: "Trong tác phẩm “Sửa đổi lối làm việc', phần Vấn đề cán bộ, theo Hồ Chí Minh, kinh nghiệm các nước và ở nước ta phải kiên quyết chống lại những bệnh nào trong công tác, trong Đảng?", opts: ["A. Bệnh tham ô, tham nhũng.", "B. Bệnh thoái hóa biến chất của cán bộ Đảng viên.", "C. Bệnh chủ quan, bệnh hẹp hòi, bệnh ba hoa.", "D. Bệnh mất đoàn kết chia rẽ nội bộ."], ans: 2 },
            { id: 134, q: "Theo Hồ Chí Minh, cách mạng giải phóng dân tộc là việc chung của cả dân chúng chứ không phải việc của [...].", opts: ["A. Một vài người.", "B. Một người.", "C. Một hai người.", "D. Một nhóm người."], ans: 2 },
            { id: 135, q: "Trong xác định vị trí, vai trò của từng lực lượng tham gia cách mạng giải phóng dân tộc, theo Hồ Chí Minh lực lượng nào là “gốc của cách mệnh'?", opts: ["A. Học trò, nhà buôn nhỏ, điền chủ nhỏ.", "B. Công nhân và nông dân.", "C. Công nhân, nông dân và binh lính.", "D. Giai cấp nông dân."], ans: 1 },
            { id: 136, q: "Trong tư tưởng đoàn kết quốc tế, Hồ Chí Minh đã định hướng hình thành những tầng mặt trận nào?", opts: ["A. Mặt trận đại đoàn kết dân tộc, Mặt trận đoàn kết Việt - Miên – Lào.", "B. Tất cả phương án.", "C. Mặt trận đại đoàn kết dân tộc, Mặt trận nhân dân tiến bộ thế giới đoàn kết với Việt Nam.", "D. Mặt trận đại đoàn kết dân tộc, Mặt trận đoàn kết Việt - Miên - Lào, Mặt trận nhân dân Á - Phi đoàn kết với VN, Mặt trận nhân dân tiến bộ TG..."], ans: 3 },
            { id: 137, q: "Tác phẩm Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân, của Hồ Chí Minh có bút danh gì?", opts: ["A. T.L.", "B. X.Y.Z.", "C. Trần Lực.", "D. Hồ Chí Minh."], ans: 0 },
            { id: 138, q: "Tìm phương án SAI trong các quan điểm sau của Hồ Chí Minh về Nhà nước thượng tôn pháp luật.", opts: ["A. Đề cao tính tự giác của con người.", "B. Chú trọng đưa pháp luật vào trong cuộc sống.", "C. Đảm bảo cho pháp luật được thi hành và có cơ chế giám sát việc thi hành pháp luật.", "D. Nêu cao tính nghiêm minh của pháp luật."], ans: 0 },
            { id: 139, q: "“Chỉ có ít nhân vật trong lịch sử trở thành một bộ phận của [...] ngay khi còn sống và rõ ràng Hồ Chí Minh là một trong số đó'", opts: ["A. Nhân loại.", "B. Huyền thoại.", "C. Thời đại.", "D. Tinh hoa văn hóa nhân loại."], ans: 1 },
            { id: 140, q: "Tìm phương án SAI trong quan điểm của Hồ Chí Minh về Nhà nước của dân.", opts: ["A. Nhà nước lấy lợi ích chính đáng của dân làm mục tiêu.", "B. Quyền lực nhà nước là “thừa ủy quyền' của nhân dân.", "C. Tất cả phương án.", "D. Quyền lực của nhà nước và xã hội thuộc về nhân dân."], ans: 2 },
            { id: 141, q: "Con đường cách mạng nhà yêu nước của ai được Hồ Chí Minh đánh giá là 'Mang nặng phong cách phong kiến'?", opts: ["A. Nguyễn Thái Học.", "B. Hoàng Hoa Thám.", "C. Phan Bội Châu.", "D. Phan Chu Trinh."], ans: 1 },
            { id: 142, q: "Nguyễn Ái Quốc biểu quyết tán thành Quốc tế III - Quốc tế Cộng sản và tham gia thành lập Đảng Cộng sản Pháp vào thời gian nào?", opts: ["A. 7/1921.", "B. 12/1920.", "C. 7/1920.", "D. 12/1921."], ans: 1 },
            { id: 143, q: "Hồ Chí Minh cho rằng, nền giáo dục mới ở Việt Nam sẽ làm cho:", opts: ["A. Dân tộc chúng ta trở nên một dân tộc anh hùng.", "B. Dân tộc chúng ta trở nên một dân tộc hùng mạnh.", "C. Dân tộc chúng ta trở nên một dân tộc văn minh.", "D. Dân tộc chúng ta trở nên một dân tộc dũng cảm, yêu nước, yêu lao động, một dân tộc xứng đáng với nước Việt Nam độc lập."], ans: 3 },
            { id: 144, q: "Đảng Cộng sản Việt Nam do Hồ Chí Minh sáng lập và rèn luyện, hoạt động vì lợi ích của ai?", opts: ["A. Giai cấp công nhân, nhân dân lao động và của cả dân tộc Việt Nam.", "B. Giai cấp công nhân.", "C. Giai cấp công nhân, nông dân và tri thức.", "D. Bản thân Đảng."], ans: 0 },
            { id: 145, q: "Theo Hồ Chí Minh, phải kiên quyết khắc phục các phản động lực trong con người và tổ chức. Đó là:", opts: ["A. Chủ nghĩa cá nhân.", "B. Tư tưởng tư sản.", "C. Phong cách tiểu tư sản.", "D. Chủ nghĩa vị kỷ."], ans: 0 },

            { id: 219, q: "Theo Hồ Chí Minh, nền tảng tư tưởng của Đảng Cộng sản Việt Nam là:", opts: ["A. Tinh hoa dân tộc và văn hóa nhân loại", "B. Chủ nghĩa Mác-Lênin", "C. Tinh hoa văn hóa nhân loại", "D. Tinh hoa văn hóa dân tộc Việt Nam"], ans: 1 },
            { id: 220, q: "Theo Hồ Chí Minh, chính sách ngoại giao của nước Việt Nam sau khi giành được độc lập năm 1945 là:", opts: ["A. Mềm dẻo về sách lược để làm bạn với tất cả mọi nước dân chủ và không gây thù oán với một ai", "B. Thân thiện với tất cả các nước dân chủ trên thế giới để giữ gìn hòa bình", "C. Độc lập, tự chủ và mềm dẻo về sách lược với tất cả các nước", "D. Độc lập, làm bạn với tất cả mọi nước dân chủ và không gây thù oán với một ai"], ans: 1 },
            { id: 221, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo giáo trình tư tưởng Hồ Chí Minh, Điều 1 của Hiến pháp 1946 nêu rõ: 'Nước Việt Nam là một nước dân chủ cộng hòa, tất cả [...] là của toàn thể nhân dân Việt Nam, không phân biệt nòi giống, gái trai, giàu nghèo, giai cấp, tôn giáo'.", opts: ["A. Quyền bính", "B. Quyền bính trong nước", "C. Quyền lực", "D. Quyền lực trong nước"], ans: 1 },
            { id: 222, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: Đánh giá về những cống hiến của Hồ Chí Minh, tiến sĩ M.Amet, Giám đốc Unesco, khu vực châu Á-Thái Bình Dương đã nhận định: 'Chỉ có ít nhân vật trong lịch sử trở thành một bộ phận của [...] ngay khi còn sống và rõ ràng Hồ Chí Minh là một trong số đó'.", opts: ["A. Huyền thoại", "B. Thời đại", "C. Nhân loại", "D. Tinh hoa văn hóa nhân loại"], ans: 0 },
            { id: 223, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: Theo Hồ Chí Minh, '[...] là quyền thiêng liêng, bất khả xâm phạm của tất cả các dân tộc'.", opts: ["A. Độc lập, tự do", "B. Độc lập dân tộc", "C. Quyền dân chủ của nhân dân", "D. Quyền tự quyết dân tộc"], ans: 0 },
            { id: 224, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: 'Thanh niên là người chủ tương lai của nước nhà. Thật vậy, nước nhà [...], yếu hay mạnh một phần lớn là do các thanh niên'.", opts: ["A. Giàu hay nghèo", "B. Lớn hay nhỏ", "C. Phát triển", "D. Thịnh hay suy"], ans: 3 },
            { id: 225, q: "Điền từ hoặc cụm từ đúng vào dấu [...]: 'Trong thế giới bây giờ chỉ có [...] và thành công đến nơi, nghĩa là dân chúng được hưởng cái hạnh phúc tự do, bình đẳng thật...'", opts: ["A. Cách mạng Nga là làm cách mạng đánh đổ tất cả đế quốc chủ nghĩa và tư bản trong thế giới", "B. Cách mạng Nga là đã thành công", "C. Cách mạng Nga là cách mạng triệt để", "D. Cách mạng Nga là đã giành thắng lợi"], ans: 2 },

            { id: 227, q: "Hồ Chí Minh đã tiếp thu các giá trị về quyền sống, quyền tự do, quyền mưu cầu hạnh phúc từ những tác phẩm nào?", opts: ["A. Tuyên ngôn của nước Anh", "B. Tuyên ngôn nhân quyền và dân quyền của nước Pháp, Tuyên ngôn độc lập của nước Mỹ", "C. Tuyên ngôn độc lập của nước Mỹ", "D. Tuyên ngôn nhân quyền và dân quyền của cách mạng Pháp"], ans: 2 },

            { id: 229, q: "Trong tác phẩm 'Chính phủ là công bộc của dân', theo Chủ tịch Hồ Chí Minh, những viên chức trong Ủy ban không được lợi dụng danh nghĩa Ủy ban để:", opts: ["A. Gây bè tìm cánh, để hãm hại người khác", "B. Kéo bè kết cánh, đưa người trong nhà vào làm việc với mình", "C. Gây bè tìm cánh, đưa người trong nhà trong họ vào làm việc với mình", "D. Kéo bè kết cánh, để trục lợi cho bản thân"], ans: 2 },

            { id: 247, q: "Tìm câu đúng nhất được trích trong định nghĩa tư tưởng Hồ Chí Minh theo quan điểm của đại hội XI:", opts: ["A. Là kết quả của sự vận dụng sáng tạo chủ nghĩa Mác- Lênin vào điều kiện cụ thể nước ta", "B. Là kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác-Lênin vào điều kiện cụ thể nước ta", "C. Là kết quả của sự vận dụng sáng tạo và phát triển chủ nghĩa Mác-Lênin...", "D. Là kết quả của sự vận dụng sáng tạo và phát triển chủ nghĩa Mác-Lênin..."], ans: 1 },
